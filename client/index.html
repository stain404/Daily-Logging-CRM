//  CSV DOWNLOAD
// ═══════════════════════════════════════════════════════
function dlCSV(data, filename) {
  const bom  = '\uFEFF';
  const csv  = data.map(r => r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename, style: 'display:none' });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  toast('Download started', `${filename}`, 'success');
}

async function doLogin() {
  const username = document.getElementById('lu').value.trim();
  const password = document.getElementById('lp').value.trim();
  const btn  = document.getElementById('loginBtn');
  const errEl = document.getElementById('lerr');
  errEl.style.display = 'none';

  if (!username || !password) {
    showLoginErr('Please enter your username and password.'); return;
  }
  btn.disabled = true;
  btn.innerHTML = `<span class="spin">${IC.spinner}</span> Signing in…`;
  try {
    const data = await POST('/auth/login', { username, password });
    TOKEN = data.token;
    CU    = data.user;
    localStorage.setItem('tf_token', TOKEN);
    localStorage.setItem('tf_user', JSON.stringify(CU));
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display   = 'block';
    initApp();
    toast('Welcome back', `Signed in as ${CU.name}`, 'success');
  } catch (e) {
    showLoginErr(e.message || 'Invalid credentials. Please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Sign in to Al Quba';
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('lerr');
  document.getElementById('lerrMsg').textContent = msg;
  el.style.display = 'flex';
}

function doLogout() {
  TOKEN = ''; CU = null;
  stopNotifPolling();
  localStorage.removeItem('tf_token');
  localStorage.removeItem('tf_user');
  document.getElementById('appWrap').style.display   = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('lu').value = '';
  document.getElementById('lp').value = '';
  toast('Signed out', 'You have been signed out.', 'info');
}

// Auto-login on page load
if (TOKEN && CU) {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display   = 'block';
  setTimeout(initApp, 0);
}

// Login keyboard
document.getElementById('lu').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('lp').focus(); });
document.getElementById('lp').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

function initApp() {
  if (!CU) return;
  const initials = CU.initials || CU.name?.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase() || '?';
  const color    = CU.color || '#2563eb';
  const gradient = `linear-gradient(135deg,${color},#0ea5e9)`;
  const roleLabels = { superadmin: 'Super Admin', admin: 'Administrator', hr: 'HR', manager: 'Team Manager', employee: 'Employee' };

  document.getElementById('tbName').textContent  = CU.name;
  document.getElementById('tbAv').textContent    = initials;
  document.getElementById('tbAv').style.background = gradient;
  document.getElementById('sbAv').textContent    = initials;
  document.getElementById('sbAv').style.background = gradient;
  document.getElementById('sbUname').textContent = CU.name;
  document.getElementById('sbUdesig').textContent = CU.designation;
  document.getElementById('sbRoleLabel').textContent = roleLabels[CU.role] || CU.role;
  document.getElementById('tbDate').textContent  = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  buildNav();
  sp('dashboard');
  startNotifPolling();
  openDeepLink();
}

// ── Deep links from email ──────────────────────────────────────────────
// The app has no router, so a link from an email arrives as ?task=<id> and is
// consumed here. initApp() runs both on a restored session and immediately
// after login, so a recipient who was signed out still lands on the task once
// they authenticate — the query string survives, because logging in never
// navigates away from the page.
function openDeepLink() {
  let id;
  try {
    id = new URLSearchParams(window.location.search).get('task');
  } catch (e) { return; }
  if (!id || !/^[a-f\d]{24}$/i.test(id)) return;

  // Stripped before opening, so a refresh (or the back button) doesn't
  // re-open the modal over whatever the user navigated to since.
  try {
    history.replaceState(null, '', window.location.pathname);
  } catch (e) { /* file:// origins reject replaceState — not fatal */ }

  // Deferred: sp('dashboard') above kicked off an async render, and opening a
  // modal mid-render leaves it behind the page content.
  setTimeout(() => viewTask(id), 60);
}

function buildNav() {
  // Files is available to every role, so it is inserted once here rather than
  // repeated into all five role lists in getNavItems(). It sits directly above
  // Settings, which is always last.
  const items = [...getNavItems()];
  const settingsAt = items.findIndex(i => i.page === 'settings');
  items.splice(settingsAt === -1 ? items.length : settingsAt, 0,
    { icon: 'files', label: 'Files', page: 'files' });

  document.getElementById('sbNav').innerHTML =
    '<div class="sb-section">Navigation</div>' +
    items.map(it =>
      `<div class="sb-item" id="nav-${it.page}" onclick="sp('${it.page}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();sp('${it.page}')}" role="button" tabindex="0">${IC[it.icon]}${it.label}</div>`
    ).join('');
}

function sp(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  const nel = document.getElementById('nav-' + page);

    dashboard: 'Dashboard', tasks: 'Tasks', submit: 'Submit Daily Update',

    audit: 'Audit Log', notifications: 'Notifications', settings: 'Settings',
    files: 'Files',

  document.getElementById('pgTitle').textContent = titles[page] || page;

  window.scrollTo({ top: 0 });
}

  if (fns[page]) await fns[page]();
}

//  CHART HELPERS
// ═══════════════════════════════════════════════════════
function animateCountUp(el) {
  const target = Number(el.dataset.countup) || 0;
  const duration = 700;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

function statusBreakdown(tasks) {
  const defs = [
    { key: 'completed',   label: 'Completed',   color: 'var(--green)' },
    { key: 'in-progress', label: 'In Progress', color: 'var(--accent)' },
    { key: 'not-started', label: 'Not Started', color: 'var(--text-faint)' },
    { key: 'delayed',     label: 'Delayed',     color: 'var(--red)' },
    { key: 'on-hold',     label: 'On Hold',     color: 'var(--warn)' },
  ];
  const total = tasks.length || 1;
  return defs.map(d => {
    const cnt = tasks.filter(t => t.status === d.key).length;
    const pct = Math.round(cnt / total * 100);
    return `<div class="hbar-row">
      <span class="hbar-label">${d.label}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${d.color}"></div></div>
      <span class="hbar-val">${cnt}</span>
    </div>`;
  }).join('');
}

// Dashboard-only variant: sources counts from /tasks/stats/summary (the true,
// correctly-scoped totals) rather than a sampled task list.
// Status hues use the theme-aware `-ink` tokens rather than the raw hues: on the
// light theme the raw values (tuned for a near-black ground) wash out on a white
// panel. Every row keeps a text label AND a count, so the low-contrast
// "Not Started" grey is never encoded by color alone.
function dashStatusBreakdown(stats) {
  const defs = [
    { label: 'Completed',   color: 'var(--green-ink)',  val: stats.completed },
    { label: 'In Progress', color: 'var(--accent-ink)', val: stats.inProgress },
    { label: 'Not Started', color: 'var(--text-faint)', val: stats.notStarted },
    { label: 'Delayed',     color: 'var(--red-ink)',    val: stats.delayed },
    { label: 'On Hold',     color: 'var(--warn-ink)',   val: stats.onHold },
  ];
  const total = stats.total || 1;
  return defs.map(d => {
    const pct = Math.round(d.val / total * 100);
    return `<div class="hbar-row" title="${d.label}: ${d.val} of ${stats.total} (${pct}%)">
      <span class="hbar-label">${d.label}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${d.color}"></div></div>
      <span class="hbar-val">${d.val}</span>
    </div>`;
  }).join('');
}

// ── Dashboard-only chart helpers ─────────────────────────────────────
// Weekly bars over a real 7-day task window (the page fetches the window
// explicitly — the old version charted only the 8 most-recent rows, so any
// day outside that slice silently read as zero).
function dashWeeklyChart(tasks) {
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 6 + i);
    return {
      date:  d.toISOString().split('T')[0],
      label: d.toLocaleDateString('en', { weekday: 'short' }),
      full:  d.toLocaleDateString('en', { month: 'short', day: 'numeric' }),
    };
  });
  const counts = days.map(d => tasks.filter(t => t.date === d.date).length);
  const max = Math.max(...counts, 1);

  // All-zero renders as seven hairlines, which reads as broken rather than empty.
  if (!counts.some(c => c > 0)) {
    return `<div class="bar-chart bar-chart-lg" style="align-items:center;justify-content:center">
      <div style="text-align:center">
        <div style="font-size:12.5px;color:var(--text-secondary);font-weight:600">No activity in the last 7 days</div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:3px">Logged updates will appear here</div>
      </div>
    </div>`;
  }

  return `<div class="bar-chart bar-chart-lg">${days.map((d, i) => {
    const cnt = counts[i];
    const h   = Math.max(3, Math.round((cnt / max) * 150));
    const isT = d.date === today();
    return `<div class="bar-col ${isT ? 'bar-today' : ''}" tabindex="0"
        aria-label="${d.full}: ${cnt} ${cnt === 1 ? 'task' : 'tasks'}">
      <div class="bar-tip">
        <div>${cnt} ${cnt === 1 ? 'task' : 'tasks'}</div>
        <div class="bar-tip-sub">${d.full}${isT ? ' · today' : ''}</div>
      </div>
      <div class="bar-hit">
        <span class="bar-count">${cnt > 0 ? cnt : ''}</span>
        <div class="bar" style="height:${h}px;background:${isT ? 'var(--accent-ink)' : 'var(--bg-raised)'}"></div>
        <span class="bar-label">${d.label}</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// Single headline rate — a gauge, not a chart. Violet per the system's
// "analytics / completion rate" semantic.
function dashRing(stats) {
  const pct = Math.max(0, Math.min(100, stats.completionRate || 0));
  const r = 56, circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  return `<div class="ring-wrap">
    <div class="ring" role="img" aria-label="Completion rate ${pct} percent">
      <svg viewBox="0 0 132 132" aria-hidden="true">
        <circle class="ring-track" cx="66" cy="66" r="${r}"></circle>
        <circle class="ring-fill"  cx="66" cy="66" r="${r}"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${circ.toFixed(1)}"
          data-ring-offset="${offset.toFixed(1)}"></circle>
      </svg>
      <div class="ring-center">
        <div><span class="ring-val" data-countup="${pct}">0</span><span class="ring-unit">%</span></div>
        <div class="ring-cap">Complete</div>
      </div>
    </div>
    <div class="ring-legend">
      <div>
        <div class="ring-leg-val" style="color:var(--green-ink)">${stats.completed}</div>
        <div class="ring-leg-lab">Done</div>
      </div>
      <div>
        <div class="ring-leg-val">${stats.total - stats.completed}</div>
        <div class="ring-leg-lab">Open</div>
      </div>
      <div>
        <div class="ring-leg-val">${stats.weekCount}</div>
        <div class="ring-leg-lab">7 Days</div>
      </div>
    </div>
  </div>`;
}

// Who logged the most in the last 7 days. Manager+ only — for an employee this
// window contains only their own rows, so the card is pointless.
function dashContributors(tasks) {
  const by = new Map();
  tasks.forEach(t => {
    const u = t.userId;
    if (!u || !u._id) return;
    const cur = by.get(u._id) || { user: u, count: 0 };
    cur.count++;
    by.set(u._id, cur);
  });
  const rows = [...by.values()].sort((a, b) => b.count - a.count).slice(0, 6);
  if (!rows.length) {
    return `<div style="padding:18px 0;text-align:center;font-size:12px;color:var(--text-muted)">No activity in the last 7 days</div>`;
  }
  const max = rows[0].count || 1;
  return rows.map((r, i) => `<div class="contrib-row">
    <span class="contrib-rank">${String(i + 1).padStart(2, '0')}</span>
    ${av(r.user, 'av-sm')}
    <span class="contrib-name">${r.user.name || '—'}</span>
    <div class="contrib-bar"><div class="contrib-fill" style="width:${Math.round(r.count / max * 100)}%"></div></div>
    <span class="contrib-val">${r.count}</span>
  </div>`).join('');
}

async function loadTasks() {
  const q  = document.getElementById('tq')?.value  || '';

  const pr = document.getElementById('tpr')?.value || '';
  const dt = document.getElementById('tdt')?.value || '';

  if (st) path += '&status=' + st;
  if (pr) path += '&priority=' + pr;
  if (dt) path += '&date=' + dt;

  const tb = document.getElementById('taskTbody');
  if (!tb) return;

  try {
    const { tasks } = await GET(path);
    const filtered = q
      ? tasks.filter(t => t.title.toLowerCase().includes(q.toLowerCase()) || t.project.toLowerCase().includes(q.toLowerCase()))
      : tasks;

    const cnt = document.getElementById('tcnt');
    if (cnt) cnt.textContent = `${filtered.length} record${filtered.length !== 1 ? 's' : ''}`;

    const canReview = ['manager','admin','superadmin'].includes(CU.role);
    tb.innerHTML = filtered.length
      ? filtered.map(t => {
          const u = t.userId;
          const reviewStatus = t.approved
            ? `<span class="badge badge-green">${IC.check} Approved</span>`
            : t.rejected
              ? `<span class="badge badge-red">${IC.x} Rejected</span>`
              : `<span class="badge badge-grey">Pending</span>`;
          const late = lateInfo(t);
          return `<tr class="${late.tier ? `late-${late.tier}` : ''}">
            <td>${employeeCell(u)}</td>
            <td style="max-width:180px">${taskTitleCell(t)}</td>
            <td><span class="chip">${esc(t.project)}</span></td>
            <td>${sbadge(t.status)}</td>
            <td style="min-width:110px">${pbar(t.completion)}</td>
            <td style="min-width:118px">${deadlineCell(t)}</td>
            <td>${reviewStatus}</td>
            <td><div class="tbl-actions">
              ${t.assignedBy && t.status === 'not-started' && getId(t.userId) === (CU._id || CU.id)
                ? `<button class="btn btn-primary btn-xs" onclick="startTask('${t._id}')" title="Start working on this task">${IC.plus} Start</button>` : ''}
              <button class="btn btn-secondary btn-xs" onclick="viewTask('${t._id}')" title="View details">${IC.eye}</button>
              ${canReview && !t.approved ? `<button class="btn btn-success btn-xs" onclick="quickApprove('${t._id}')" title="Quick approve">${IC.check}</button>` : ''}
              ${canReview ? `<button class="btn btn-danger btn-xs" onclick="deleteTask('${t._id}','${t.title.replace(/'/g,"\\'")}',loadTasks)" title="Delete task">${IC.trash}</button>` : ''}
            </div></td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="8"><div class="empty">
          <div class="empty-icon">${IC.tasks}</div>
          <div class="empty-title">No tasks found</div>
          <div class="empty-sub">Try adjusting your filters or submit a new daily update.</div>
        </div></td></tr>`;
  } catch (e) {
    tb.innerHTML = `<tr><td colspan="8"><div class="empty">
      <div class="empty-icon">${IC.alert}</div>
      <div class="empty-title">Failed to load tasks</div>
      <div class="empty-sub">${e.message}</div>
    </div></td></tr>`;
  }
}

async function viewTask(id) {
  try {
    const { tasks } = await GET('/tasks?limit=5000');
    const t = tasks.find(x => x._id === id);
    if (!t) { toast('Not found', 'Task could not be loaded.', 'error'); return; }
    const canReview = ['manager','admin','superadmin'].includes(CU.role) && !t.approved;
    const u = t.userId;

    openModal('Task Details',
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div><div class="profile-field-label">Employee</div><div class="profile-field-val">${getName(u)}</div></div>
        <div><div class="profile-field-label">Date</div><div class="profile-field-val">${fmtDate(t.date)}</div></div>
        <div><div class="profile-field-label">Project</div><div class="profile-field-val">${t.project}</div></div>
        <div><div class="profile-field-label">Status</div><div style="margin-top:2px">${sbadge(t.status)}</div></div>
        <div><div class="profile-field-label">Priority</div><div style="margin-top:2px">${pbadge(t.priority)}</div></div>
        <div><div class="profile-field-label">Hours</div><div class="profile-field-val">${t.startTime} – ${t.endTime} (${t.hours}h)</div></div>
        <div><div class="profile-field-label">Deadline</div><div class="profile-field-val">${deadlineCell(t)}</div></div>
      </div>
      <div class="profile-field-label">Description</div>
      <div style="padding:10px;background:var(--bg-raised);border-radius:var(--radius);font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.6">${t.description || t.desc || 'No description provided.'}</div>
      <div class="profile-field-label" style="margin-bottom:6px">Completion</div>
      ${pbar(t.completion)}
      <div style="margin-bottom:14px"></div>
      ${t.challenges ? `<div class="review-challenge">${IC.alert}<span>${t.challenges}</span></div>` : ''}
      ${t.nextPlan ? `<div style="margin-bottom:12px"><div class="profile-field-label">Next Day Plan</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${t.nextPlan}</div></div>` : ''}
      ${t.mgComment ? `<div class="feedback-block" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;justify-content:space-between"><div class="feedback-block-label">Manager Feedback</div>${['manager','admin','superadmin'].includes(CU.role) ? `<button class="btn btn-xs" style="background:var(--red-wash);color:var(--red-ink)" onclick="clearReview('${t._id}')" title="Delete this feedback">${IC.trash} Remove</button>` : ''}</div><div class="feedback-block-text">${t.mgComment}</div>${t.mgRating ? `<div>${stars(t.mgRating)}</div>` : ''}</div>` : ''}
      ${canReview ? `<div style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px">
        <div class="profile-field-label" style="margin-bottom:8px">Add Review</div>
        <div class="form-group"><textarea class="form-textarea" id="rvCmt" placeholder="Write your feedback…">${t.mgComment || ''}</textarea></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select class="form-select" style="width:auto" id="rvRat">
            <option value="">Rate this task</option>
            ${[1,2,3,4,5].map(n => `<option value="${n}">${'★'.repeat(n)} ${n}/5</option>`).join('')}
          </select>
          <button class="btn btn-success btn-sm" onclick="doReview('${t._id}','approve')">${IC.check} Approve</button>
          <button class="btn btn-danger btn-sm"  onclick="doReview('${t._id}','reject')">${IC.x} Reject</button>
        </div>
      </div>` : ''}
      <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:14px">
        <div class="profile-field-label" style="margin-bottom:2px">Attachments</div>
        <div id="taskFilesBox"><div class="file-empty">Loading files…</div></div>
      </div>`,
      null, true
    );

    // Populated after the modal is in the DOM — the attachment list is a
    // second request and should not hold up the details the user asked for.
    loadTaskFiles(t._id);
  } catch (e) { toast('Error', e.message, 'error'); }
}

async function doReview(id, action) {
  try {
    const comment = document.getElementById('rvCmt')?.value || '';
    const rating  = parseInt(document.getElementById('rvRat')?.value) || null;
    await PUT('/tasks/' + id + '/review', { action, comment, rating });
    closeModal();
    toast(action === 'approve' ? 'Task approved' : 'Task rejected', '', action === 'approve' ? 'success' : 'error');
    loadTasks();
  } catch (e) { toast('Review failed', e.message, 'error'); }
}

async function quickApprove(id) {
  try {
    await PUT('/tasks/' + id + '/review', { action: 'approve', comment: 'Approved' });
    toast('Task approved', '', 'success');
    loadTasks();
  } catch (e) { toast('Failed', e.message, 'error'); }
}

let _assignedPickList = [];

function applyAssignedTask() {
  const id      = document.getElementById('tf_pick').value;
  const titleEl = document.getElementById('tf_title');
  const projEl  = document.getElementById('tf_proj');

  if (id === 'custom') {
    titleEl.value = '';
    projEl.value  = '';
    titleEl.readOnly = false;
    projEl.readOnly  = false;
    titleEl.style.background = '';
    projEl.style.background  = '';
    return;
  }

  const t = _assignedPickList.find(x => x._id === id);
  if (!t) return;
  titleEl.value = t.title;
  projEl.value  = t.project;
  titleEl.readOnly = true;
  projEl.readOnly  = true;
  titleEl.style.background = 'var(--bg-raised)';
  projEl.style.background  = 'var(--bg-raised)';
  document.getElementById('tf_desc').value = t.description || '';
  const priEl = document.getElementById('tf_pri');
  if (priEl) priEl.value = t.priority;
}

async function rdSubmit() {
  const el = document.getElementById('page-submit');
  pageLoader(el);
  let existing = null;
  try {
    const { tasks } = await GET('/tasks?date=' + today());
    existing = tasks.find(t => getId(t.userId) === CU._id || getId(t.userId) === CU.id);
  } catch(e) {}

  let assignedTasks = [];
  try {
    const { tasks } = await GET('/tasks?limit=100');
    assignedTasks = tasks.filter(t => t.assignedBy && (t.status !== 'completed' || (existing && t._id === existing._id)));
  } catch(e) {}
  _assignedPickList = assignedTasks;

  const ex = existing;
  const pickedId = ex?.assignedBy ? ex._id : 'custom';
  el.innerHTML = `<div style="max-width:740px;margin:0 auto">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Daily Update — ${fmtDate(today())}</div>
          <div class="card-subtitle">${ex ? 'Editing your existing submission for today' : 'Submit your end-of-day task update'}</div>
        </div>
        ${ex ? `<span class="badge badge-blue">${IC.info} Already submitted</span>` : ''}
      </div>
      <div class="card-body">
        ${assignedTasks.length ? `<div class="form-group" style="margin-bottom:14px">
          <label class="form-label">Task</label>
          <select class="form-select" id="tf_pick" onchange="applyAssignedTask()">
            <option value="custom" ${pickedId==='custom'?'selected':''}>Custom Task</option>
            ${assignedTasks.map(t => `<option value="${t._id}" ${pickedId===t._id ? 'selected' : ''}>${t.title} — ${t.project}${t.assignedBy?.name ? ' (from ' + t.assignedBy.name + ')' : ''}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="form-row" style="margin-bottom:14px">
          <div class="form-group">
            <label class="form-label">Task Title <span style="color:var(--red-ink)">*</span></label>
            <input class="form-input" id="tf_title" placeholder="Brief task title…" value="${ex?.title || ''}" ${pickedId!=='custom'?'readonly style="background:var(--bg-raised)"':''}>
          </div>
          <div class="form-group">
            <label class="form-label">Project <span style="color:var(--red-ink)">*</span></label>
            <input class="form-input" id="tf_proj" placeholder="Project name…" value="${ex?.project || ''}" ${pickedId!=='custom'?'readonly style="background:var(--bg-raised)"':''}>

        <div class="form-group" style="margin-bottom:14px">

          <textarea class="form-textarea" id="tf_desc" placeholder="What did you work on today? Describe your tasks, progress, and output…">${ex?.description || ex?.desc || ''}</textarea>
        </div>

        <div class="form-row" style="margin-bottom:14px">
          <div class="form-group">
            <label class="form-label">Status <span style="color:var(--red-ink)">*</span></label>
            <select class="form-select" id="tf_status">
              <option value="">Select status…</option>

              <option value="in-progress" ${ex?.status==='in-progress' ?'selected':''}>In Progress</option>
              <option value="not-started" ${ex?.status==='not-started' ?'selected':''}>Not Started</option>
              <option value="delayed"     ${ex?.status==='delayed'     ?'selected':''}>Delayed</option>
              <option value="on-hold"     ${ex?.status==='on-hold'     ?'selected':''}>On Hold</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Priority <span style="color:var(--red-ink)">*</span></label>
            <select class="form-select" id="tf_pri">
              <option value="">Select priority…</option>
              <option value="critical" ${ex?.priority==='critical'?'selected':''}>Critical</option>
              <option value="high"     ${ex?.priority==='high'    ?'selected':''}>High</option>
              <option value="medium"   ${ex?.priority==='medium'  ?'selected':''}>Medium</option>

            </select>

        <div class="form-row3" style="margin-bottom:14px">

          </div>

            <label class="form-label">End Time</label>

        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-secondary" onclick="sp('tasks')">${IC.x} Cancel</button>

async function submitTask(existingId) {
  const title  = document.getElementById('tf_title').value.trim();
  const proj   = document.getElementById('tf_proj').value.trim();
  const status = document.getElementById('tf_status').value;
  const pri    = document.getElementById('tf_pri').value;

  if (!title || !proj || !status || !pri) {
    toast('Validation error', 'Please fill in all required fields.', 'error'); return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spin">${IC.spinner}</span> Saving…`;

  const body = {
    title, project: proj,
    description: document.getElementById('tf_desc').value,
    priority: pri, status,
    startTime: document.getElementById('tf_start').value,
    endTime:   document.getElementById('tf_end').value,
    hours:     parseFloat(document.getElementById('tf_hrs').value) || 0,
    completion: parseInt(document.getElementById('tf_comp').value) || 0,
    challenges: document.getElementById('tf_chal').value,
    support:    document.getElementById('tf_sup').value,
    nextPlan:   document.getElementById('tf_next').value,
  };

  try {
    if (existingId) { await PUT('/tasks/' + existingId, body); toast('Update saved', 'Your daily update has been updated.', 'success'); }
    else            { await POST('/tasks', body);               toast('Update submitted', 'Your daily update has been submitted.', 'success'); }
    sp('tasks');
  } catch (e) {
    toast('Submission failed', e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = `${IC.submit} ${existingId ? 'Update' : 'Submit'} Daily Update`;
  }
}

function clearTaskTextFields() {
  const fields = ['tf_desc', 'tf_chal', 'tf_sup', 'tf_next'];
  fields.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  toast('Fields cleared', 'Description, challenges, support, and next plan have been cleared. Hit Update to save.', 'info');
}

async function rdReviews() {
  const el = document.getElementById('page-reviews');
  pageLoader(el);
  try {
    const { tasks } = await GET('/tasks?limit=200');
    const pending = tasks.filter(t => !t.approved && !t.rejected && t.status !== 'not-started');
    const done    = tasks.filter(t => t.approved || t.rejected);

    el.innerHTML = `
      <div class="tab-bar">
        <div class="tab active" id="rvt1" onclick="switchReviewTab(1)">
          Pending Reviews <span class="tab-count">${pending.length}</span>
        </div>
        <div class="tab" id="rvt2" onclick="switchReviewTab(2)">
          Reviewed <span class="tab-count">${done.length}</span>
        </div>
      </div>

      <div id="rv1">
        ${pending.length === 0
          ? `<div class="empty">
              <div class="empty-icon">${IC.check}</div>
              <div class="empty-title">All caught up!</div>
              <div class="empty-sub">No pending task reviews. Your team is on track.</div>
            </div>`
          : pending.map(t => {
              const u = t.userId;
              return `<div class="card review-card">
                <div class="card-header">
                  <div style="display:flex;align-items:center;gap:10px">
                    ${u ? av(u, 'av-md') : ''}
                    <div>
                      <div style="font-weight:700;font-size:13px">${getName(u)} — ${t.title}</div>
                      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${t.project} · ${fmtDate(t.date)}</div>
                    </div>
                  </div>
                  <div style="display:flex;gap:6px">${sbadge(t.status)}${pbadge(t.priority)}</div>
                </div>
                <div class="card-body">
                  <div class="review-meta">
                    <div class="review-meta-item"><div class="review-meta-label">Hours</div><div class="review-meta-val">${t.hours}h</div></div>
                    <div class="review-meta-item"><div class="review-meta-label">Completion</div><div class="review-meta-val">${t.completion}%</div></div>
                    <div class="review-meta-item"><div class="review-meta-label">Support Needed</div><div class="review-meta-val" style="font-size:12px;font-weight:500">${t.support || 'No'}</div></div>
                  </div>
                  <div class="review-desc">${t.description || t.desc || 'No description provided.'}</div>
                  ${t.challenges ? `<div class="review-challenge">${IC.alert}<span>${t.challenges}</span></div>` : ''}
                  ${t.mgComment ? `<div style="padding:10px;background:var(--warn-wash);border-radius:var(--radius);border-left:3px solid var(--warn);font-size:12px;color:var(--text-primary);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px"><span><strong>Prior comment:</strong> ${t.mgComment}</span><button class="btn btn-xs" style="background:var(--red-wash);color:var(--red-ink);flex-shrink:0" onclick="clearReview('${t._id}')" title="Delete this comment">${IC.trash} Clear</button></div>` : ''}
                  <div class="form-group">
                    <textarea class="form-textarea" id="rc_${t._id}" placeholder="Write your feedback for this task…"></textarea>
                  </div>
                  <div class="review-actions">
                    <select class="form-select" style="width:auto" id="rr_${t._id}">
                      <option value="">Rate this task</option>
                      ${[1,2,3,4,5].map(n => `<option value="${n}">${'★'.repeat(n)} ${n}/5</option>`).join('')}
                    </select>
                    <button class="btn btn-success btn-sm" onclick="reviewAction('${t._id}','approve')">${IC.check} Approve</button>
                    <button class="btn btn-ghost btn-sm"   onclick="reviewAction('${t._id}','clarify')">${IC.question} Request Clarification</button>
                    <button class="btn btn-danger btn-sm"  onclick="reviewAction('${t._id}','reject')">${IC.x} Reject</button>
                    <button class="btn btn-danger btn-xs"  onclick="deleteTask('${t._id}','${t.title.replace(/'/g,"\\'")}',rdReviews)" title="Permanently delete this task" style="margin-left:auto">${IC.trash} Delete</button>
                  </div>
                </div>
              </div>`;
            }).join('')}
      </div>

      <div id="rv2" style="display:none">
        ${done.length === 0
          ? `<div class="empty"><div class="empty-icon">${IC.reviews}</div><div class="empty-title">No reviewed tasks yet</div></div>`
          : `<div class="card"><div class="table-wrap">
              <table class="tbl">
                <thead><tr><th>Employee</th><th>Task</th><th>Decision</th><th>Rating</th><th>Feedback</th><th>Actions</th></tr></thead>
                <tbody>
                ${done.slice(0, 30).map(t => {
                  const u = t.userId;
                  return `<tr>
                    <td>${employeeCell(u)}</td>
                    <td style="max-width:200px">${taskTitleCell(t)}</td>
                    <td>${t.approved ? `<span class="badge badge-green">${IC.check} Approved</span>` : `<span class="badge badge-red">${IC.x} Rejected</span>`}</td>
                    <td>${t.mgRating ? stars(t.mgRating) : '—'}</td>
                    <td style="font-size:12px;color:var(--text-muted);max-width:200px">${t.mgComment || '—'}</td>
                    <td><div class="tbl-actions">
                      <button class="btn btn-ghost btn-xs" title="Clear review (keep task)" onclick="clearReview('${t._id}')" style="color:var(--accent-ink)">${IC.refresh} Clear</button>
                      <button class="btn btn-danger btn-xs" title="Permanently delete task" onclick="deleteTask('${t._id}','${t.title.replace(/'/g,"\\'")}',rdReviews)">${IC.trash} Delete</button>
                    </div></td>
                  </tr>`;

              </table>

    el.innerHTML = `<div class="empty"><div class="empty-icon">${IC.alert}</div><div class="empty-title">Failed to load reviews</div><div class="empty-sub">${e.message}</div><button class="btn btn-primary" onclick="rdReviews()">${IC.refresh} Retry</button></div>`;
  }
}

function switchReviewTab(n) {
  document.getElementById('rv1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('rv2').style.display = n === 2 ? 'block' : 'none';
  document.getElementById('rvt1').classList.toggle('active', n === 1);
  document.getElementById('rvt2').classList.toggle('active', n === 2);
}

async function reviewAction(id, action) {
  try {
    const comment = document.getElementById('rc_' + id)?.value || '';
    const rating  = parseInt(document.getElementById('rr_' + id)?.value) || null;
    if (action === 'clarify') {
      if (!comment.trim()) { toast('Comment required', 'Please write a message explaining what clarification is needed.', 'warning'); return; }
      await PUT('/tasks/' + id + '/review', { action: 'clarify', comment: 'Clarification needed: ' + comment });
      toast('Clarification requested', '', 'info');
    } else {
      await PUT('/tasks/' + id + '/review', { action, comment, rating });
      toast(action === 'approve' ? 'Task approved' : 'Task rejected', '', action === 'approve' ? 'success' : 'error');
    }
    rdReviews();
  } catch (e) { toast('Review failed', e.message, 'error'); }
}

async function clearReview(id) {
  if (!confirm('Clear this review? The task will go back to pending and all feedback (comment, rating, approval) will be removed.')) return;
  try {
    await PUT('/tasks/' + id + '/clear-review', {});
    toast('Review cleared', 'Task is back in the pending queue.', 'info');
    closeModal();
    // Refresh whichever page is currently active
    const activePage = document.querySelector('.page.active');
    if (activePage?.id === 'page-reviews') rdReviews();
    else loadTasks();
  } catch (e) { toast('Failed to clear review', e.message, 'error'); }
}

async function deleteTask(id, title, refreshFn) {
  if (!confirm(`Permanently delete "${title}"? This cannot be undone.`)) return;
  try {
    await DELETE('/tasks/' + id);
    toast('Task deleted', `"${title}" has been permanently removed.`, 'success');
    closeModal();
    if (typeof refreshFn === 'function') refreshFn();
  } catch (e) { toast('Delete failed', e.message, 'error'); }
}

async function loadEmpTable() {
  const q  = document.getElementById('eq')?.value || '';
  const tb = document.getElementById('empTbody');
  if (!tb) return;
  try {
    const { users } = await GET('/users' + (q ? '?search=' + encodeURIComponent(q) : ''));
    const cnt = document.getElementById('ecnt');
    if (cnt) cnt.textContent = `${users.length} user${users.length !== 1 ? 's' : ''}`;
    const isSA = CU.role === 'superadmin';
    const isHR = CU.role === 'hr';
    const showActionsCol = isSA || isHR;
    tb.innerHTML = users.length
      ? users.map(u => {
          const hrCanEdit = isHR && ['employee', 'manager'].includes(u.role);
          const canEdit    = isSA || hrCanEdit;
          return `<tr>
          <td><div style="display:flex;align-items:center;gap:10px">
            ${av(u, 'av-sm')}
            <div><div style="font-weight:600;font-size:12px">${u.name}</div><div style="font-size:10px;color:var(--text-muted)">${u.email}</div></div>
          </div></td>
          <td><span class="chip">${u.empId}</span></td>
          <td>${roleBadge(u.role)}</td>
          <td style="font-size:12px">${u.department?.name || '—'}</td>
          <td style="font-size:12px">${u.team?.name || '—'}</td>
          <td>${u.active ? `<span class="badge badge-green">${IC.check} Active</span>` : `<span class="badge badge-red">Inactive</span>`}</td>
          ${showActionsCol ? `<td><div class="tbl-actions">
            ${canEdit ? `<button class="btn btn-secondary btn-xs" onclick="editEmpModal('${u._id}')" title="Edit">${IC.edit}</button>` : ''}
            ${isSA     ? `<button class="btn btn-danger btn-xs"    onclick="confirmDelEmp('${u._id}','${u.name}')" title="Delete">${IC.trash}</button>` : ''}
          </div></td>` : ''}

        }).join('')
      : `<tr><td colspan="${showActionsCol ? 7 : 6}"><div class="empty">

async function manageMembersModal(id) {
  let tm; let allUsers = [];
  try {
    const { teams } = await GET('/teams'); tm = teams.find(t => t._id === id);
    const r = await GET('/users'); allUsers = r.users;
  } catch (e) { toast('Error', e.message, 'error'); return; }

  const renderBody = () => {
    const memberIds  = tm.members.map(m => m._id);
    const candidates = allUsers.filter(u =>
      ['employee', 'manager'].includes(u.role) && u.active && !memberIds.includes(u._id)
    );
    return `
      <div style="margin-bottom:16px">
        <div class="profile-field-label" style="margin-bottom:8px">Current Members (${tm.members.length})</div>
        ${tm.members.length ? `<div style="display:flex;flex-direction:column;gap:6px">

            ${av(m,'av-sm')}

            <button class="btn btn-danger btn-xs" onclick="removeTeamMember('${id}','${m._id}')" title="Remove">${IC.x}</button>
          </div>`).join('')}
        </div>` : `<div style="font-size:12px;color:var(--text-muted)">No members yet.</div>`}
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:1">
          <label class="form-label">Add Member</label>
          <select class="form-select" id="mm_add">
            <option value="">Select employee…</option>
            ${candidates.map(u => `<option value="${u._id}">${u.name} (${u.designation || u.role})</option>`).join('')}
          </select>
        </div>
      </div>`;
  };

  openModal('Manage Members — ' + tm.name, renderBody(), [
    { label: 'Close', cls: 'btn-secondary', fn: closeModal },
    { label: 'Add Member', cls: 'btn-primary', fn: async () => {

          const { team } = await PUT('/teams/' + id + '/members', { add: [userId] });

          toast('Member added', '', 'success');
          rdTeams();
        } catch (e) { toast('Failed', e.message, 'error'); }

  ], true);

// ═══════════════════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════════════════
let _notifs        = [];
let _notifUnread   = 0;
let _notifsLoaded  = false;
let _notifTimer    = null;
const _seenNotifs  = new Set();   // every id we've already shown the user
let _justInNotifs  = new Set();   // ids to blink on the next render
const NOTIF_POLL_MS = 30000;

// ── Sound ─────────────────────────────────────────────────────────────
// Synthesised, so there's no audio asset to ship or fetch. Two stacked
// partials with a fast attack and long exponential decay read as a "ting"
// rather than a beep.
let _audioCtx = null;
const notifSoundOn = () => localStorage.getItem('tf_notif_sound') !== 'off';

function unlockAudio() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
  } catch (_) { /* no Web Audio — notifications stay silent, nothing breaks */ }
}
// Browsers refuse to start an AudioContext before a user gesture, so prime
// it on the first interaction of the session.
['click', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { once: true, passive: true }));

function ting() {
  try {
    unlockAudio();
    if (!_audioCtx || _audioCtx.state !== 'running') return;
    const t0 = _audioCtx.currentTime;
    [[1318.5, 0.16], [1975.5, 0.05]].forEach(([freq, peak]) => {
      const osc  = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(peak, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
      osc.connect(gain).connect(_audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.95);
    });
  } catch (_) { /* never let a sound failure break the poll loop */ }
}

function toggleNotifSound() {
  localStorage.setItem('tf_notif_sound', notifSoundOn() ? 'off' : 'on');
  rdNotifs();
  if (notifSoundOn()) ting();
}

// ── Arrival cue: ting + bell shake + dot flare ────────────────────────
function alertNewNotifs(fresh) {
  if (notifSoundOn()) ting();

  // remove → reflow → add, so the animation restarts on repeat arrivals
  [['notifBtn', 'ringing'], ['notifDot', 'flare']].forEach(([id, cls]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  });

  const top = fresh[0];
  if (top) toast(top.title, top.message, top.severity === 'danger' ? 'error'
                                      : top.severity === 'warning' ? 'warning'
                                      : top.severity === 'success' ? 'success' : 'info');
}

// ── Fetch ─────────────────────────────────────────────────────────────
async function loadNotifs() {
  try {
    const data  = await GET('/notifications?limit=50');
    const fresh = data.notifications || [];

    // Anything unread we haven't shown before is "new". The first load of a
    // session only seeds the set — logging in shouldn't fire the sound for
    // every notification that piled up while you were away.
    const incoming = fresh.filter(n => !n.read && !_seenNotifs.has(n._id));
    fresh.forEach(n => _seenNotifs.add(n._id));

    _notifs      = fresh;
    _notifUnread = data.unread || 0;
    paintNotifBadge();

    if (_notifsLoaded && incoming.length) {
      _justInNotifs = new Set(incoming.map(n => n._id));
      alertNewNotifs(incoming);
      // Clear the blink flag so a later re-render doesn't replay it
      setTimeout(() => { _justInNotifs = new Set(); }, 4000);
    }
    _notifsLoaded = true;

    // Keep the page live if the user is sitting on it
    if (document.getElementById('page-notifications')?.classList.contains('active')) rdNotifs();
  } catch (_) { /* offline or token expired — the next tick retries */ }
}

function paintNotifBadge() {
  const dot = document.getElementById('notifDot');
  if (dot) dot.style.display = _notifUnread > 0 ? 'block' : 'none';
}

function startNotifPolling() {
  stopNotifPolling();
  loadNotifs();
  _notifTimer = setInterval(() => {
    if (!document.hidden) loadNotifs();   // don't poll a background tab
  }, NOTIF_POLL_MS);
}
function stopNotifPolling() {
  if (_notifTimer) clearInterval(_notifTimer);
  _notifTimer = null;
  _notifs = []; _notifUnread = 0; _notifsLoaded = false;
  _seenNotifs.clear();
  paintNotifBadge();
}
// Catch up immediately when the user comes back to the tab
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && _notifTimer) loadNotifs();
});

// ── Render ────────────────────────────────────────────────────────────
function timeAgo(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60)     return 'Just now';
  if (s < 3600)   return `${Math.floor(s / 60)}m ago`;
  if (s < 86400)  return `${Math.floor(s / 3600)}h ago`;
  if (s < 604800) return `${Math.floor(s / 86400)}d ago`;
  return d.toLocaleDateString();
}

async function rdNotifs() {
  const el = document.getElementById('page-notifications');
  if (!el) return;

  const soundOn = notifSoundOn();

  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Notifications</div>
          <div class="card-subtitle">${_notifUnread} unread notification${_notifUnread !== 1 ? 's' : ''}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="toggleNotifSound()"
                  title="${soundOn ? 'Mute the notification chime' : 'Unmute the notification chime'}">
            ${soundOn ? '🔔 Sound on' : '🔕 Muted'}
          </button>
          <button class="btn btn-secondary btn-sm" onclick="markAllNotifsRead()"
                  ${_notifUnread ? '' : 'disabled'}>Mark all as read</button>
        </div>
      </div>
      <div>
        ${_notifs.length
          ? _notifs.map(n => `
              <div class="notif-item ${n.read ? '' : 'unread'} sev-${n.severity || 'info'} ${_justInNotifs.has(n._id) ? 'just-in' : ''}"
                   onclick="markNotifRead('${n._id}')">
                <div class="notif-head">
                  <span class="notif-title">${esc(n.title)}${
                    !n.read ? ` <span class="badge badge-blue" style="font-size:10px;vertical-align:middle">New</span>` : ''
                  }</span>
                  <span class="notif-time">${timeAgo(n.createdAt)}</span>
                </div>
                <div class="notif-msg">${esc(n.message || '')}</div>
                ${n.emailed ? `<div class="notif-emailed" title="A copy of this was emailed to you">${IC.mail} Emailed to you</div>` : ''}
              </div>`).join('')
          : `<div class="empty"><div class="empty-icon">${IC.notifications}</div><div class="empty-title">No notifications</div><div class="empty-sub">You're all caught up!</div></div>`}
      </div>
    </div>`;
}

async function markNotifRead(id) {
  const n = _notifs.find(x => x._id === id);
  if (!n || n.read) return;
  n.read = true;                                  // optimistic
  _notifUnread = Math.max(0, _notifUnread - 1);
  paintNotifBadge(); rdNotifs();
  try { await PUT(`/notifications/${id}/read`); } catch (_) { loadNotifs(); }
}

async function markAllNotifsRead() {
  _notifs.forEach(n => { n.read = true; });
  _notifUnread = 0;
  paintNotifBadge(); rdNotifs();
  try { await PUT('/notifications/read-all'); } catch (_) { loadNotifs(); }
}

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  FILE SHARING
// ═══════════════════════════════════════════════════════
// Uploads go browser -> S3 directly using a presigned POST the server issues.
// The file bytes never pass through the API, which is what makes a 25 MB cap
// survivable on a small dyno. Three steps: ask for a URL, POST to S3, tell the
// server it landed.

let FILECFG = null;   // cached /attachments/config

async function fileConfig() {
  if (!FILECFG) {
    try { FILECFG = (await GET('/attachments/config')).config; }
    catch (e) { FILECFG = { enabled: false, maxMb: 25, allowedTypes: [], allowedExts: '' }; }
  }
  return FILECFG;
}

const fmtBytes = b => {
  if (!b) return '0 KB';
  return b < 1024 * 1024 ? `${Math.round(b / 1024)} KB` : `${(b / 1024 / 1024).toFixed(1)} MB`;
};

// Filenames and notes are user-authored and land in innerHTML — they go
// through the existing esc() helper defined above.

async function doUpload(file, meta, onProgress) {
  const cfg = await fileConfig();
  if (!cfg.enabled) throw new Error('File storage is not configured on this server.');
  if (file.size > cfg.maxMb * 1024 * 1024) {
    throw new Error(`That file is ${fmtBytes(file.size)}. The limit is ${cfg.maxMb} MB.`);
  }

  // 1. Reserve a row and get the presigned POST.
  const init = await POST('/attachments/upload-url', {
    filename: file.name,
    mimeType: file.type,
    size:     file.size,
    ...meta,
  });

  // 2. Straight to S3. XHR rather than fetch purely because it reports upload
  //    progress, which matters at 25 MB on an office connection.
  const form = new FormData();
  Object.entries(init.upload.fields).forEach(([k, v]) => form.append(k, v));
  form.append('file', file);

  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', init.upload.url);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) return resolve();

      // S3 answers a rejection with an XML <Error><Code>..</Code></Error>.
      // Without reading it every failure looks like a bare status code, which
      // is useless — a bad secret and an oversized file both show as 403/400.
      let code = '', msg = '';
      try {
        const doc = new DOMParser().parseFromString(xhr.responseText || '', 'text/xml');
        code = doc.querySelector('Code')?.textContent || '';
        msg  = doc.querySelector('Message')?.textContent || '';
      } catch (e) { /* not XML — fall back to the status code */ }

      const HINTS = {
        SignatureDoesNotMatch: 'AWS_SECRET_ACCESS_KEY on the server is wrong or has a stray space.',
        InvalidAccessKeyId:    'AWS_ACCESS_KEY_ID on the server does not match an existing key.',
        AccessDenied:          'The IAM user is not allowed to write to this bucket.',
        EntityTooLarge:        'The file is larger than the upload limit.',
        EntityTooSmall:        'The file is empty.',
        ExpiredToken:          'The upload link expired — try again.',
        NoSuchBucket:          'S3_BUCKET on the server names a bucket that does not exist.',
      };

      reject(new Error(
        code
          ? `${code}${HINTS[code] ? ' — ' + HINTS[code] : (msg ? ': ' + msg : '')}`
          : `Storage rejected the upload (HTTP ${xhr.status}).`
      ));
    };
    // status 0 with no response is the signature of a blocked CORS preflight,
    // which is a different problem from the server refusing the upload.
    xhr.onerror = () => reject(new Error(
      'Could not reach storage. If this persists it is usually the bucket CORS rule not listing this site.'
    ));
    xhr.send(form);
  });

  // 3. Server confirms with S3 and makes the row visible.
  const done = await POST(`/attachments/${init.attachmentId}/complete`, {});
  return done.attachment;
}

async function downloadFile(id) {

  } catch (e) {
    toast('Download failed', e.message, 'error');

// ── Recipient picker state ─────────────────────────────────────────────
let FS_PEOPLE = [];   // everyone selectable
let FS_PICKED = [];   // ids chosen so far, in the order they were added
let FS_ACTIVE = -1;   // highlighted row in the open menu, for arrow keys

function fsRenderChips() {
  const box = document.getElementById('fsChips');
  if (!box) return;
  box.innerHTML = FS_PICKED.map(id => {
    const u = FS_PEOPLE.find(p => p._id === id);
    if (!u) return '';
    return `<span class="chip"><span>${esc(u.name)}</span><button type="button"
      aria-label="Remove ${esc(u.name)}" onclick="event.stopPropagation();fsRemove('${id}')">&times;</button></span>`;
  }).join('');
}

function fsMatches() {
  const q = (document.getElementById('fsSearch')?.value || '').trim().toLowerCase();
  return FS_PEOPLE
    .filter(u => !FS_PICKED.includes(u._id))
    .filter(u => !q || u.name.toLowerCase().includes(q)
              || (u.designation || '').toLowerCase().includes(q)
              || (u.empId || '').toLowerCase().includes(q));
}

function fsRenderMenu(open) {
  const menu = document.getElementById('fsMenu');
  const input = document.getElementById('fsSearch');
  if (!menu) return;
  const rows = fsMatches();
  if (FS_ACTIVE >= rows.length) FS_ACTIVE = rows.length - 1;

  menu.innerHTML = rows.length
    ? rows.map((u, i) => `<div class="picker-opt ${i === FS_ACTIVE ? 'active' : ''}" role="option"
         aria-selected="${i === FS_ACTIVE}" onmousedown="event.preventDefault();fsAdd('${u._id}')">
         ${av(u, 'av-xs')}<span>${esc(u.name)}</span>
         <span class="picker-opt-role">${esc(u.designation || u.role)}</span>
       </div>`).join('')
    : `<div class="picker-empty">${FS_PICKED.length === FS_PEOPLE.length ? 'Everyone is already selected.' : 'No one matches that.'}</div>`;

  menu.classList.toggle('open', !!open);
  if (input) input.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function fsAdd(id) {
  if (!FS_PICKED.includes(id)) FS_PICKED.push(id);
  const input = document.getElementById('fsSearch');
  if (input) { input.value = ''; input.focus(); }
  FS_ACTIVE = -1;
  fsRenderChips();
  fsRenderMenu(true);
}

function fsRemove(id) {
  FS_PICKED = FS_PICKED.filter(x => x !== id);
  fsRenderChips();
  fsRenderMenu(document.getElementById('fsMenu')?.classList.contains('open'));
}

function fsKey(e) {
  const rows = fsMatches();
  if (e.key === 'ArrowDown')      { e.preventDefault(); FS_ACTIVE = Math.min(FS_ACTIVE + 1, rows.length - 1); fsRenderMenu(true); }
  else if (e.key === 'ArrowUp')   { e.preventDefault(); FS_ACTIVE = Math.max(FS_ACTIVE - 1, 0); fsRenderMenu(true); }
  else if (e.key === 'Enter')     { e.preventDefault(); if (rows[FS_ACTIVE]) fsAdd(rows[FS_ACTIVE]._id); }
  else if (e.key === 'Escape')    { fsRenderMenu(false); }
  // Backspace on an empty box removes the last chip — the behaviour people
  // expect from a token field, and the only way to undo without the mouse.
  else if (e.key === 'Backspace' && !e.target.value && FS_PICKED.length) {
    fsRemove(FS_PICKED[FS_PICKED.length - 1]);
  }
}

async function buildComposer() {
  const cfg = await fileConfig();
  const box = document.getElementById('fileComposer');

  // Employees can only see the user list through this endpoint if their role
  // allows it; when it does not, they can still send to their own manager,
  // which the server resolves. Fall back rather than showing an error.
  let people = [];
  try {
    const { users } = await GET('/users?active=true');
    people = users.filter(u => u._id !== CU._id);
  } catch (e) { people = []; }

  box.innerHTML = `
    <div class="form-group">
      <label class="form-label" id="fsToLabel">Send to</label>
      ${people.length
        ? `<div class="picker" id="fsPicker">
             <div class="picker-field" onclick="document.getElementById('fsSearch').focus()">
               <span id="fsChips"></span>
               <input class="picker-input" id="fsSearch" autocomplete="off"
                      role="combobox" aria-expanded="false" aria-controls="fsMenu" aria-labelledby="fsToLabel"
                      placeholder="Search for a person…">
             </div>
             <div class="picker-menu" id="fsMenu" role="listbox"></div>
           </div>
           <div class="file-hint" style="margin-top:5px">Pick one, or keep going to add more.</div>`
        : `<div class="file-empty">No recipients available to you.</div>`}
    </div>
    <div class="form-group">
      <label class="form-label">Note <span style="color:var(--text-faint);font-weight:400">(optional)</span></label>
      <input class="form-input" id="fsNote" maxlength="500" placeholder="What is this file for?">
    </div>
    <div class="form-group">
      <label class="form-label">File</label>
      <input type="file" id="fsFile" class="file-input" accept="${cfg.allowedTypes.join(',')}">
      <div class="file-hint" style="margin-top:5px" id="fsHint">Max ${cfg.maxMb} MB · ${cfg.allowedExts}</div>
    </div>
    <button class="btn btn-primary" onclick="sendFile()" ${people.length ? '' : 'disabled'}>${IC.send} Send file</button>`;

  // Wired here rather than with inline handlers: the menu has to close on an
  // outside click, which needs a document listener regardless.
  FS_PEOPLE = people;
  FS_PICKED = [];
  FS_ACTIVE = -1;

  const input = document.getElementById('fsSearch');
  if (input) {
    input.addEventListener('input', () => { FS_ACTIVE = 0; fsRenderMenu(true); });
    input.addEventListener('focus', () => { FS_ACTIVE = 0; fsRenderMenu(true); });
    input.addEventListener('keydown', fsKey);
    document.addEventListener('click', e => {
      if (!document.getElementById('fsPicker')?.contains(e.target)) fsRenderMenu(false);
    });
    fsRenderChips();
  }
}

async function sendFile() {
  const note = document.getElementById('fsNote').value.trim();
  const file = document.getElementById('fsFile').files?.[0];
  const hint = document.getElementById('fsHint');

  const recipients = [...FS_PICKED];
  if (!recipients.length) { toast('No recipient', 'Choose at least one person.', 'warning'); return; }
  if (!file)              { toast('No file', 'Choose a file to send.', 'warning'); return; }

  try {
    hint.textContent = 'Uploading… 0%';
    await doUpload(file, { kind: 'direct-message', recipients, note },
      p => hint.textContent = `Uploading… ${p}%`);
    toast('Sent', `"${file.name}" sent to ${recipients.length} ${recipients.length === 1 ? 'person' : 'people'}.`, 'success');
    await buildComposer();
    FILES_TAB = 'sent';
    await rdFiles();
  } catch (e) {
    hint.textContent = '';
    toast('Send failed', e.message, 'error');
  }
}

function switchFilesTab(tab) {
  FILES_TAB = tab;
  document.getElementById('ftab-received')?.classList.toggle('active', tab === 'received');
  document.getElementById('ftab-sent')?.classList.toggle('active', tab === 'sent');
  loadInbox();
}

async function loadInbox() {
  const list = document.getElementById('fileList');
  if (!list) return;
  try {
    const { received, sent } = await GET('/attachments/inbox');
    const rows = FILES_TAB === 'received' ? received : sent;

    list.innerHTML = rows.length
      ? rows.map(f => fileRow(f, {
          showDelete: FILES_TAB === 'sent',
          after: '() => loadInbox()',
          context: FILES_TAB === 'received'
            ? `From ${f.uploadedBy?.name || '—'}`
            : `To ${(f.recipients || []).map(r => r.name).join(', ') || (f.task ? 'task: ' + (f.task.title || '') : '—')}`,
        })).join('')
      : `<div class="file-empty">${FILES_TAB === 'received' ? 'Nothing has been sent to you yet.' : 'You have not sent any files yet.'}</div>`;
  } catch (e) {
    list.innerHTML = `<div class="file-empty">Could not load files: ${esc(e.message)}</div>`;
  }
}

// ── Email notification preferences ─────────────────────────────────────
const PREF_COPY = {
  emailTaskAssigned: {
    title: 'A task is assigned to me',
    desc:  'Emailed when a manager assigns you a task, including the deadline and a link straight to it.',
  },
  emailTaskSubmitted: {
    title: 'Someone I oversee submits work',
    desc:  'Emailed when an employee you supervise submits a task for review.',
  },
  emailTaskReviewed: {
    title: 'My submission is reviewed',
    desc:  'Emailed when a manager approves, rejects, or asks for clarification on your work.',
  },
};

function prefsCard(prefs, err) {
  if (err) {
    return `<div class="card mb">
      <div class="card-header"><div class="card-title">Email Notifications</div></div>
      <div class="card-body"><div class="pref-desc">Could not load your preferences: ${err}</div></div>
    </div>`;
  }
  if (!prefs) return '';

  const locked = prefs.locked || [];

  // The "someone I oversee submits" row is only rendered for people who
  // actually receive that email — the server decides who that is by returning
  // it in `locked`. Showing an employee a switch that governs nothing they
  // will ever be sent is worse than showing them nothing.
  const keys = Object.keys(PREF_COPY).filter(k =>
    k !== 'emailTaskSubmitted' || locked.includes('emailTaskSubmitted')
  );

  const rows = keys.map(k => {
    const isLocked = locked.includes(k);
    // A locked switch renders on regardless of the stored value, because that
    // is what will actually happen at send time.
    const on = isLocked || prefs.prefs[k] !== false;
    return `<div class="pref-row">
      <div class="pref-copy">
        <div class="pref-title">${PREF_COPY[k].title}</div>
        <div class="pref-desc">${PREF_COPY[k].desc}</div>
        ${isLocked ? '<div class="pref-locked">Required for reviewers — cannot be turned off</div>' : ''}
      </div>
      <label class="sw" title="${isLocked ? 'Reviewers must receive submission alerts' : PREF_COPY[k].title}">
        <input type="checkbox" id="pref_${k}" ${on ? 'checked' : ''} ${isLocked ? 'disabled' : ''}
               onchange="savePref('${k}', this.checked)"
               aria-label="${PREF_COPY[k].title}">
        <span class="sw-track"></span><span class="sw-thumb"></span>
      </label>
    </div>`;
  }).join('');

  // No address means every switch above is academic. Say so rather than
  // letting someone toggle happily and wonder why nothing arrives.
  const noEmail = prefs.hasEmail ? '' : `<div class="review-challenge" style="margin-bottom:4px">${IC.alert}<span>Your account has no email address, so no notifications can be delivered. Add one above first.</span></div>`;

  return `<div class="card mb">
    <div class="card-header"><div class="card-title">Email Notifications</div></div>
    <div class="card-body">
      ${noEmail}
      ${rows}
    </div>
  </div>`;
}

async function savePref(key, value) {
  const input = document.getElementById('pref_' + key);
  try {
    const out = await PUT('/users/me/notification-prefs', { [key]: value });

  } catch (e) {
    // Put the switch back — leaving it showing a state the server rejected is
    // how people end up believing they opted out when they did not.
    if (input) input.checked = !value;
    toast('Not saved', e.message, 'error');
  }
}

async function changePassword() {
  const curr = document.getElementById('cp_curr').value;
  const nw   = document.getElementById('cp_new').value;
  const cf   = document.getElementById('cp_conf').value;
  if (!curr || !nw || !cf) { toast('All fields required', '', 'error'); return; }
  if (nw.length < 6) { toast('Too short', 'New password must be at least 6 characters.', 'error'); return; }
  if (nw !== cf) { toast('Passwords don\'t match', 'Please re-enter your new password.', 'error'); return; }
  try {
    await POST('/auth/change-password', { currentPassword: curr, newPassword: nw });
    ['cp_curr','cp_new','cp_conf'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    toast('Password updated', 'Your password has been changed successfully.', 'success');
  } catch (e) { toast('Failed', e.message, 'error'); }
}

function openModal(title, body, btns, lg) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML    = body;
  document.getElementById('modalBox').className     = 'modal' + (lg ? ' modal-lg' : '');
  const foot = document.getElementById('modalFoot');
  if (btns && btns.length) {
    foot.innerHTML = btns.map((b, i) => `<button class="btn ${b.cls}" id="_mb${i}">${b.label}</button>`).join('');
    btns.forEach((b, i) => document.getElementById('_mb' + i).addEventListener('click', b.fn));
  } else { foot.innerHTML = ''; }
  document.getElementById('overlay').classList.add('show');
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target === document.getElementById('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeConfirm(); } });

function openConfirm(title, msg, onOk, okCls = 'btn-danger') {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').innerHTML     = msg;
  const btn = document.getElementById('confirmOkBtn');
  btn.className = 'btn ' + okCls;
  btn.onclick   = onOk;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }
document.getElementById('confirmOverlay').addEventListener('click', e => { if (e.target === document.getElementById('confirmOverlay')) closeConfirm(); });

const TOAST_ICONS = {
  success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  error:   `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
  info:    `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  warning: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
};

function toast(title, msg = '', type = 'info', duration = 4000) {
  const wrap = document.getElementById('toastWrap');
  const el   = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    ${TOAST_ICONS[type] || TOAST_ICONS.info}
    <div class="toast-msg">
      ${title ? `<div class="toast-title">${title}</div>` : ''}
      ${msg    ? `<div style="font-size:12px;margin-top:2px;color:var(--text-muted)">${msg}</div>` : ''}
    </div>
    <button class="toast-close" onclick="this.closest('.toast').remove()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, duration);
}
</script>
</body>
</html>

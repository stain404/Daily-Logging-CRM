services:
  - type: web
    name: daily-logging-crm
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 7d
      # Seeds 12 demo users (password admin123) on a fresh empty database.
      # Set to true for the very first boot only, then back to false.
      - key: SEED_DB
        value: "false"
      # Generated once by Render and kept out of the repo.
      - key: JWT_SECRET
        generateValue: true
      # Paste the mongodb+srv:// URI in the Render dashboard.
      - key: MONGODB_URI
        sync: false
